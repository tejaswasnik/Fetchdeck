<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration: eight connections download one file; when one finishes, it takes over half of the slowest connection's remaining bytes">
<rect width="900" height="230" rx="16" fill="#101513"/>
<rect x="1" y="1" width="898" height="228" rx="15" stroke="#2E3832" stroke-width="2"/>
<text x="40" y="48" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#F1EFE8">One file, eight connections</text>
<g transform="translate(40 76)">
<rect x="0.0" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="0.0" y="0" width="36.3" height="22" rx="11.0" fill="#2BD67B"/>
<rect x="65.9" y="0" width="29.6" height="22" rx="11.0" fill="#F1EFE8" opacity="0.9"/>
<rect x="103.5" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="103.5" y="0" width="95.5" height="22" rx="11.0" fill="#2BD67B"/>
<rect x="207.0" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="207.0" y="0" width="87.9" height="22" rx="11.0" fill="#2BD67B"/>
<rect x="310.5" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="310.5" y="0" width="95.5" height="22" rx="11.0" fill="#2BD67B"/>
<rect x="414.0" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="414.0" y="0" width="80.2" height="22" rx="11.0" fill="#2BD67B"/>
<rect x="517.5" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="517.5" y="0" width="95.5" height="22" rx="11.0" fill="#2BD67B"/>
<rect x="621.0" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="621.0" y="0" width="91.7" height="22" rx="11.0" fill="#2BD67B"/>
<rect x="724.5" y="0" width="95.5" height="22" rx="11.0" fill="#1B231F"/>
<rect x="724.5" y="0" width="74.5" height="22" rx="11.0" fill="#2BD67B"/>
</g>
<g font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16">
<rect x="40" y="132" width="14" height="14" rx="4" fill="#2BD67B"/><text x="62" y="145" fill="#B6B4AA">downloaded</text>
<rect x="170" y="132" width="14" height="14" rx="4" fill="#1B231F"/><text x="192" y="145" fill="#B6B4AA">still to do</text>
<rect x="290" y="132" width="14" height="14" rx="4" fill="#F1EFE8"/><text x="312" y="145" fill="#B6B4AA">taken over by a finished connection</text>
</g>
<text x="40" y="190" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#B6B4AA">Each connection writes at its own offset into one file, so nothing is merged at the end.</text>
</svg>
