name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # The release is created once, with the matching CHANGELOG section as its notes.
  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelogSection.mjs "$version" > notes.md
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Fetchdeck $version" --notes-file notes.md $flags

  # Each OS builds its installer and attaches it, with a SHA-256 checksum file, to that release.
  build:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Checksums
        working-directory: app/release
        run: |
          shopt -s nullglob
          files=(*.exe *.AppImage *.deb)
          sha256sum "${files[@]}" > "SHA256SUMS-${RUNNER_OS}.txt"
          cat "SHA256SUMS-${RUNNER_OS}.txt"
      - name: Attach to the release
        working-directory: app/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" *.exe *.AppImage *.deb "SHA256SUMS-${RUNNER_OS}.txt" --clobber

  # The extension is a plain folder to load unpacked, so it ships as a zip with its own checksum.
  extension:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w extension
      - name: Zip and attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="Fetchdeck-Extension-${version}.zip"
          (cd extension/dist && zip -r -X "$GITHUB_WORKSPACE/$name" .)
          sha256sum "$name" > "${name}.sha256"
          cat "${name}.sha256"
          gh release upload "$GITHUB_REF_NAME" "$name" "${name}.sha256" --clobber
